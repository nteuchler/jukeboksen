<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jukeboks</title>
  <style>
    body { font-family: sans-serif; max-width: 650px; margin: 2rem auto; padding: 0 1rem; background: #f3f1eb; color: #202020; }
    section { background: white; padding: 1.2rem; margin: 1rem 0; border-radius: 10px; }
    button, select, input { font: inherit; padding: .7rem 1rem; margin: .25rem; }
    button.active { background: #176b55; color: white; }
    .control-row { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }
    input[type="range"] { flex: 1; min-width: 180px; padding-left: 0; padding-right: 0; }
    #volume:disabled { accent-color: #888; filter: grayscale(1); opacity: .5; cursor: not-allowed; }
    #volume:disabled + output { color: #777; }
    output { min-width: 3.5rem; font-weight: bold; }
    #error { color: #a21d1d; }
    #power-warning { background: #fff0c2; color: #664500; border: 2px solid #b87900; padding: 1rem; border-radius: 10px; }
    #power-warning[data-active="true"] { background: #ffe0dc; color: #851b12; border-color: #b52b20; }
    #coin-count { font-size: 2.5rem; color: #176b55; }
  </style>
</head>
<body>
  <h1>Jukeboks control</h1>
  <p id="power-warning" role="status" aria-live="polite" hidden></p>
  <section aria-labelledby="coin-heading">
    <h2 id="coin-heading">Coins detected</h2>
    <output id="coin-count" aria-live="polite" aria-label="Coins detected">—</output>
    <p>Total since the app started.</p>
  </section>
  <section>
    <h2>Mode</h2>
    <button class="mode" data-mode="nfc">NFC reader</button>
    <button class="mode" data-mode="idle">Idle</button>
    <button class="mode" data-mode="local_files">Local files</button>
    <button class="mode" data-mode="bluetooth">Bluetooth speaker</button>
    <button class="mode" data-mode="music_quiz">Music quiz</button>
    <p id="quiz-status" hidden aria-live="polite"></p>
  </section>
  <section>
    <h2>Local music</h2>
    <select id="tracks"></select>
    <button id="play">Play</button>
    <button id="stop">Stop</button>
  </section>
  <section>
    <h2>Volume</h2>
    <button id="mute" aria-pressed="false">Mute</button>
    <div class="control-row">
      <input id="volume" type="range" min="0" max="100" step="1" aria-label="Output volume">
      <output id="volume-value" for="volume" aria-live="polite">--%</output>
    </div>
  </section>
  <section>
    <h2>RGB mode</h2>
    <button class="rgb" data-rgb="off">Off</button>
    <button class="rgb" data-rgb="flame">Flame</button>
    <button class="rgb" data-rgb="party">Party</button>
    <button class="rgb" data-rgb="equalizer">Equalizer</button>
    <p id="rgb-error"></p>
  </section>
  <section>
    <strong id="mode">Loading…</strong>
    <p id="message"></p>
    <p id="details"></p>
    <p id="nfc-status"></p>
    <p id="error"></p>
  </section>
  <section>
    <h2>Inputs</h2>
    <p id="inputs-status"></p>
    <p id="encoder-button-status" aria-live="polite"></p>
    <button id="encoder-button-toggle" role="switch" aria-checked="true" disabled>Disable encoder button</button>
    <div id="inputs-states">Loading inputs…</div>
    <h3>Recent events (30 minutes)</h3>
    <div id="inputs-log" style="max-height:220px; overflow:auto; font-family: monospace; background:#f7f7f7; padding:.5rem; border-radius:6px;">Loading…</div>
  </section>
  <script>
    async function api(url, body) {
      const response = await fetch(url, {method: body ? 'POST' : 'GET', headers: {'Content-Type': 'application/json'}, body: body ? JSON.stringify(body) : undefined});
      const data = await response.json();
      if (!response.ok) throw new Error(data.error);
      return data;
    }
    async function refresh() {
      const status = await api('/api/status');
      const power = status.power;
      const powerWarning = document.querySelector('#power-warning');
      powerWarning.hidden = Boolean(power?.available && !power.undervoltage && !power.undervoltage_occurred);
      powerWarning.dataset.active = String(Boolean(power?.undervoltage));
      powerWarning.textContent = !power?.available
        ? 'Power monitoring unavailable.'
        : power.undervoltage
        ? 'Power warning: supply voltage is too low now. Check the power supply, cable, and connected loads. Bluetooth and audio may be unreliable.'
        : power.undervoltage_occurred
        ? 'Power warning: low supply voltage was detected earlier since the Pi booted. Voltage is normal now. Check the power supply and cable; this history clears after reboot.'
        : '';
      document.querySelector('#mode').textContent = `Mode: ${status.mode}`;
      document.querySelector('#message').textContent = status.message;
      const quiz = document.querySelector('#quiz-status');
      quiz.hidden = status.mode !== 'music_quiz';
      quiz.textContent = status.quiz?.error || (status.quiz?.winner
        ? `Player ${status.quiz.winner} wins the buzz! Resume on your phone for the next round.`
        : 'Connect your phone to Jukeboks and play music. Arcade 1 = red; Arcade 2 = green. First press wins.');
      document.querySelectorAll('.rgb').forEach(button => button.disabled = status.mode === 'music_quiz');
      document.querySelector('#details').textContent = status.playing ? `Playing: ${status.track}${status.output_muted ? ' (muted)' : ''}` : status.bluetooth_active ? 'Bluetooth active' : 'Not playing';
      document.querySelectorAll('.mode').forEach(button => button.classList.toggle('active', button.dataset.mode === status.mode));
      const volume = document.querySelector('#volume');
      volume.disabled = status.output_muted;
      const mute = document.querySelector('#mute');
      mute.textContent = status.output_muted ? 'Unmute' : 'Mute';
      mute.setAttribute('aria-pressed', String(status.output_muted));
      mute.classList.toggle('active', status.output_muted);
      if (volume.disabled || document.activeElement !== volume) volume.value = status.volume;
      document.querySelector('#volume-value').textContent = `${volume.value}%${status.output_muted ? ' (muted)' : ''}`;
      document.querySelectorAll('.rgb').forEach(button => button.classList.toggle('active', button.dataset.rgb === status.rgb.mode));
      document.querySelector('#rgb-error').textContent = status.rgb.error || '';
      const nfc = status.nfc || {};
      document.querySelector('#nfc-status').textContent = status.mode !== 'nfc' ? ''
        : nfc.error ? `NFC error: ${nfc.error}`
        : !nfc.connected ? 'Connecting to NFC reader…'
        : `NFC: ${nfc.uid || 'waiting for tag'} | Last UID: ${nfc.last_uid || 'none'} | Detections: ${nfc.detections}`;
      // fetch inputs
      try {
        const inputs = await api('/api/inputs');
        const states = inputs.states || {};
        const inputStatus = inputs.status || {};
        document.querySelector('#encoder-button-status').textContent = inputStatus.encoder_button_disabled
          ? 'Encoder button disabled. Rotation still controls volume.'
          : 'Encoder button enabled';
        const encoderToggle = document.querySelector('#encoder-button-toggle');
        encoderToggle.disabled = typeof inputStatus.encoder_button_disabled !== 'boolean';
        encoderToggle.textContent = inputStatus.encoder_button_disabled ? 'Enable encoder button' : 'Disable encoder button';
        encoderToggle.setAttribute('aria-checked', String(!inputStatus.encoder_button_disabled));
        document.querySelector('#coin-count').textContent = inputStatus.coin_count ?? '—';
        document.querySelector('#inputs-status').textContent = inputStatus.error
          ? `GPIO error: ${inputStatus.error}`
          : `GPIO backend: ${inputStatus.backend || 'unknown'}`;
        const container = document.querySelector('#inputs-states');
        container.innerHTML = Object.keys(states).map(k => `<span style="display:inline-block;min-width:120px;">${({PLAY_PAUSE: 'Play / pause', STOP: 'Stop'})[k] || k}: <strong>${states[k] ? 'PRESSED' : 'released'}</strong></span>`).join(' ');
      } catch (e) {
        document.querySelector('#inputs-status').textContent = `Input status unavailable: ${e.message}`;
        document.querySelector('#inputs-states').textContent = 'Unable to read inputs';
      }
    }
    async function act(url, body) {
      document.querySelector('#error').textContent = '';
      try { await api(url, body); await refresh(); } catch (error) { document.querySelector('#error').textContent = error.message; }
    }
    async function refreshLog() {
      try {
        const log = await api('/api/inputs/log');
        const el = document.querySelector('#inputs-log');
        if (!log.events) { el.textContent = 'No events'; return; }
        el.innerHTML = log.events.slice().reverse().map(e => `${e.time}  ${({PLAY_PAUSE: 'Play / pause', STOP: 'Stop'})[e.event] || e.event}`).join('\n');
      } catch (e) {
        // ignore
      }
    }
    document.querySelectorAll('.mode').forEach(button => button.onclick = () => act('/api/mode', {mode: button.dataset.mode}));
    document.querySelector('#play').onclick = () => act('/api/play', {track: document.querySelector('#tracks').value});
    document.querySelector('#stop').onclick = () => act('/api/stop', {});
    document.querySelector('#mute').onclick = () => act('/api/mute', {});
    document.querySelector('#encoder-button-toggle').onclick = event => act('/api/inputs/encoder', {
      enabled: event.currentTarget.getAttribute('aria-checked') !== 'true'
    });
    const volume = document.querySelector('#volume');
    volume.oninput = () => { document.querySelector('#volume-value').textContent = `${volume.value}%`; };
    volume.onchange = () => act('/api/volume', {volume: Number(volume.value)});
    document.querySelectorAll('.rgb').forEach(button => button.onclick = () => act('/api/rgb', {mode: button.dataset.rgb}));
    api('/api/tracks').then(data => { document.querySelector('#tracks').innerHTML = data.tracks.map(track => `<option>${track}</option>`).join(''); });
    refresh(); setInterval(refresh, 1000);
    refreshLog(); setInterval(refreshLog, 5000);
  </script>
</body>
</html>
